
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mineria Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- NAV FIJO LATERAL -->
    <aside class="sidebar">
        <div class="logo">LOGO</div>
        <nav class="nav-icons">
            <button onclick="mostrarPanel('usuario')" title="Usuario">👤</button>
            <button onclick="mostrarPanel('mapa')" title="Mapa">🗺️</button>
            <button onclick="mostrarPanel('builder')" title="Builder">🛠️</button>
            <button onclick="mostrarPanel('reportes')" title="Reportes">📊</button>
        </nav>
    </aside>

    <!-- PANEL CONFIGURACIÓN DESPLEGABLE -->
    <aside class="panel-config oculto" id="panelConfig">
        <div id="contenidoPanel"></div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content">
        <header>
            <span>DATA USA etc</span>
        </header>

        <section class="cajaDashboar">
            <!-- 1. Torta -->
            <div class="Dashboard">
                <div class="headerDash">Pokémon por Tipo</div>
                <div class="dashboardProper">
                <canvas id="chartTipos"></canvas>
                </div>
            </div>

            <!-- 2. Barras -->
            <div class="Dashboard">
                <div class="headerDash">Promedio de Ataque por Tipo</div>
                <div class="dashboardProper">
                <canvas id="chartAtaque"></canvas>
                </div>
            </div>

            <!-- 3. Radar -->
            <div class="Dashboard">
                <div class="headerDash">Comparativa de Stats Promedio</div>
                <div class="dashboardProper">
                <canvas id="chartRadar"></canvas>
                </div>
            </div>

            <!-- 4. Línea -->
            <div class="Dashboard">
                <div class="headerDash">Experiencia Base por ID</div>
                <div class="dashboardProper">
                <canvas id="chartLinea"></canvas>
                </div>
            </div>
            </section>

            <canvas id="myChart"></canvas>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
