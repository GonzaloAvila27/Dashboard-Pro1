<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mineria Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- NAV FIJO LATERAL -->
    <aside class="sidebar">
        <div class="logo">LOGO</div>
        <nav class="nav-icons">
            <button onclick="mostrarPanel('usuario')" title="Usuario">👤</button>
            <button onclick="mostrarPanel('mapa')" title="Mapa">🗺️</button>
            <button onclick="mostrarPanel('builder')" title="Builder">🛠️</button>
            <button onclick="mostrarPanel('reportes')" title="Reportes">📊</button>
        </nav>
    </aside>

    <!-- PANEL CONFIGURACIÓN DESPLEGABLE -->
    <aside class="panel-config oculto" id="panelConfig">
        <div id="contenidoPanel"></div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content">
        <header>
            <span>DATA USA etc</span>
        </header>

        <section class="cajaDashboar">
            <div class="Dashboard"><div class="headerDash">Line chart 1</div>
        
            <div class="dashboardProper">
                    <div class="filters">
                        <div>
                            <label for="chartType">Tipo de Gráfico:</label>
                            <select id="chartType">
                                <option value="line">Línea</option>
                                <option value="bar">Barras</option>
                            </select>
                        </div>
                            <div>
                                <label for="monthFilter">Filtrar por Mes:</label>
                                <select id="monthFilter">
                                    <option value="all">Todos</option>
                                    <option value="January">Enero</option>
                                    <option value="February">Febrero</option>
                                    <option value="March">Marzo</option>
                                    <option value="April">Abril</option>
                                    <option value="May">Mayo</option>
                                    <option value="June">Junio</option>
                                </select>
                            </div>
                        <canvas id="myChart">chard</canvas>
                </div>
            </div>
            </div>
            <div class="Dashboard"><div class="headerDash">Dashboard 2</div>
            
                <div class="dashboardProper">

                </div>
            </div>
            
            <div class="Dashboard"><div class="headerDash">Dashboard 3</div>
            
                <div class="dashboardProper">

                </div>
            </div>
            <div class="Dashboard"><div class="headerDash">Dashboard 4</div>
            
                <div class="dashboardProper">

                </div>
            </div>
        </section>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
